name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  classify:
    name: Classify release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      stable: ${{ steps.release.outputs.stable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$package_version" != "$version" ]; then
            echo "Tag version ($version) does not match Cargo.toml version ($package_version)" >&2
            exit 1
          fi
          case "$version" in
            *-*) stable=false ;;
            *) stable=true ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 peeled commit

      - name: Wait for the independently published Browser crate
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 - <<'PY'
          import pathlib
          import tomllib

          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          requirement = manifest["dependencies"]["a3s-use-browser"]["version"]
          if not requirement.startswith("=") or len(requirement) == 1:
              raise SystemExit(
                  "a3s-use-browser must use an exact '=x.y.z' release version"
              )
          print(requirement[1:])
          PY
          )
          for attempt in $(seq 1 30); do
            if curl --retry 3 --retry-all-errors --retry-delay 2 -fsSL \
              -A "a3s-search-release-check/1.0" \
              "https://crates.io/api/v1/crates/a3s-use-browser/${version}" >/dev/null; then
              echo "a3s-use-browser ${version} is available"
              exit 0
            fi
            echo "Waiting for a3s-use-browser ${version} on crates.io (${attempt}/30)"
            sleep 10
          done
          echo "a3s-use-browser ${version} must be published before A3S Search" >&2
          exit 1

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: |
          cargo clippy --all-targets --no-default-features --locked -- -D warnings
          cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: |
          cargo test --no-default-features --locked
          cargo test --all-features --locked

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked

      - name: Release archive contract
        run: scripts/test-release-package.sh

      - name: Package verification
        run: cargo package --locked

  freeze-crate:
    name: Freeze exact crate bytes
    needs: [classify, ci]
    runs-on: ubuntu-latest
    outputs:
      crate_sha256: ${{ steps.identity.outputs.crate_sha256 }}
      manifest_sha256: ${{ steps.identity.outputs.manifest_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 peeled commit

      - name: Package and freeze
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.classify.outputs.version }}"
          cargo package --locked
          scripts/freeze-crate.sh \
            "target/package/a3s-search-${version}.crate" \
            frozen-crate \
            "$GITHUB_SHA" \
            "$GITHUB_REF"

      - name: Export frozen identities
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import pathlib

          manifest_path = pathlib.Path("frozen-crate/frozen-crate.json")
          manifest_bytes = manifest_path.read_bytes()
          manifest = json.loads(manifest_bytes)
          print(f"crate_sha256={manifest['package']['sha256']}")
          print(
              "manifest_sha256=sha256:"
              + hashlib.sha256(manifest_bytes).hexdigest()
          )
          PY

      - name: Upload frozen crate
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frozen-crate-${{ needs.classify.outputs.version }}
          path: frozen-crate
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  commercial-search-gates:
    name: Stable release evidence (blocked)
    if: needs.classify.outputs.stable == 'true'
    needs: [classify, ci, freeze-crate]
    runs-on: ubuntu-latest
    steps:
      - name: Refuse candidate-repository commercial certification
        env:
          FROZEN_CRATE_SHA256: ${{ needs.freeze-crate.outputs.crate_sha256 }}
          FROZEN_MANIFEST_SHA256: ${{ needs.freeze-crate.outputs.manifest_sha256 }}
          FROZEN_ARTIFACT_ID: ${{ needs.freeze-crate.outputs.artifact_id }}
          FROZEN_ARTIFACT_DIGEST: ${{ needs.freeze-crate.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FROZEN_CRATE_SHA256"
          test -n "$FROZEN_MANIFEST_SHA256"
          test -n "$FROZEN_ARTIFACT_ID"
          test -n "$FROZEN_ARTIFACT_DIGEST"
          echo "Stable publication requires an external pinned verifier" >&2
          echo "bound to the exact frozen .crate bytes and raw campaign receipts." >&2
          echo "Tracking: https://github.com/A3S-Lab/Search/issues/8" >&2
          exit 1

  commercial-release-gate:
    name: Stable release gate
    if: always() && !cancelled()
    needs: [classify, ci, freeze-crate, commercial-search-gates]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable evidence
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          CI_RESULT: ${{ needs.ci.result }}
          FROZEN_CRATE_RESULT: ${{ needs.freeze-crate.result }}
          COMMERCIAL_RESULT: ${{ needs.commercial-search-gates.result }}
          STABLE: ${{ needs.classify.outputs.stable }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CLASSIFY_RESULT" = success
          test "$CI_RESULT" = success
          test "$FROZEN_CRATE_RESULT" = success
          if [ "$STABLE" = true ]; then
            test "$COMMERCIAL_RESULT" = success
          else
            test "$COMMERCIAL_RESULT" = skipped
          fi

  # ───────────────────────────────────────────────
  # Build CLI binary for 4 platforms
  # ───────────────────────────────────────────────
  build-cli:
    name: Build / ${{ matrix.name }}
    needs: commercial-release-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            name: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: darwin-x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-arm64
            cross: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 peeled commit

      - name: Install cross toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip & Package
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/a3s-search"
          STRIP=${STRIP_CMD:-strip}
          $STRIP "$BINARY" 2>/dev/null || true

          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="a3s-search-${VERSION}-${{ matrix.name }}.tar.gz"
          scripts/package-release.sh "$BINARY" "$ARCHIVE"
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.name }}
          path: ${{ env.ARCHIVE }}

  # ───────────────────────────────────────────────
  # Publish core crate to crates.io
  # ───────────────────────────────────────────────
  publish-crate:
    name: Crate publication evidence (blocked)
    needs: commercial-release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Refuse credentialed candidate publication
        shell: bash
        run: |
          set -euo pipefail
          echo "Crate publication remains disabled until a trusted job can upload" >&2
          echo "the exact externally attested frozen .crate without executing candidate code." >&2
          echo "Tracking: https://github.com/A3S-Lab/Search/issues/8" >&2
          exit 1

  # ───────────────────────────────────────────────
  # Create GitHub Release with CLI binaries
  # ───────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [classify, publish-crate, build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cli-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            NOTES="Initial release"
          else
            NOTES=$(git log "${PREV_TAG}..HEAD" --oneline --no-merges --pretty=format:"- %s" | head -50)
          fi
          echo "$NOTES" > /tmp/release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE: ${{ needs.classify.outputs.stable }}
        run: |
          if [ "$STABLE" = true ]; then
            PRERELEASE_FLAG="--prerelease=false"
          else
            PRERELEASE_FLAG="--prerelease"
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md \
              --draft=false \
              $PRERELEASE_FLAG \
              --verify-tag
            gh release upload "$GITHUB_REF_NAME" \
              artifacts/*.tar.gz artifacts/checksums.txt \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md \
              $PRERELEASE_FLAG \
              --verify-tag \
              artifacts/*.tar.gz artifacts/checksums.txt
          fi

  # ───────────────────────────────────────────────
  # Update Homebrew formula
  # ───────────────────────────────────────────────
  update-homebrew:
    name: Homebrew
    if: needs.classify.outputs.stable == 'true'
    needs: [classify, github-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cli-*
          path: artifacts
          merge-multiple: true

      - name: Compute checksums
        id: sha
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          for platform in darwin-arm64 darwin-x86_64 linux-arm64 linux-x86_64; do
            FILE="artifacts/a3s-search-${VERSION}-${platform}.tar.gz"
            if [ -f "$FILE" ]; then
              HASH=$(sha256sum "$FILE" | awk '{print $1}')
              KEY=$(echo "$platform" | tr '-' '_')
              echo "${KEY}=$HASH" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Checkout homebrew-tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: A3S-Lab/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          VERSION="${{ steps.sha.outputs.version }}"
          SHA_DARWIN_ARM64="${{ steps.sha.outputs.darwin_arm64 }}"
          SHA_DARWIN_X86_64="${{ steps.sha.outputs.darwin_x86_64 }}"
          SHA_LINUX_ARM64="${{ steps.sha.outputs.linux_arm64 }}"
          SHA_LINUX_X86_64="${{ steps.sha.outputs.linux_x86_64 }}"

          cat > homebrew-tap/Formula/a3s-search.rb << EOF
          class A3sSearch < Formula
            desc "Extensible web search CLI with native AnySearch and Tavily providers"
            homepage "https://github.com/A3S-Lab/Search"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/A3S-Lab/Search/releases/download/v${VERSION}/a3s-search-${VERSION}-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/A3S-Lab/Search/releases/download/v${VERSION}/a3s-search-${VERSION}-darwin-x86_64.tar.gz"
                sha256 "${SHA_DARWIN_X86_64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/A3S-Lab/Search/releases/download/v${VERSION}/a3s-search-${VERSION}-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/A3S-Lab/Search/releases/download/v${VERSION}/a3s-search-${VERSION}-linux-x86_64.tar.gz"
                sha256 "${SHA_LINUX_X86_64}"
              end
            end

            def install
              bin.install "a3s-search"
              (pkgshare/"skills").install "skills/a3s-search"
            end

            test do
              assert_match "a3s-search", shell_output("#{bin}/a3s-search --version")
              assert_path_exists pkgshare/"skills/a3s-search/SKILL.md"
              assert_path_exists pkgshare/"skills/a3s-search/agents/openai.yaml"
            end
          end
          EOF

      - name: Commit and push
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.sha.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/a3s-search.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "a3s-search: update to ${VERSION}"
          git push
