[package]
name = "a3s-search-node"
version = "0.8.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
a3s-search = { path = "../..", default-features = false, features = ["headless", "lightpanda"] }
napi = { version = "2", features = ["async", "tokio_rt"] }
napi-derive = "2"
tokio = { version = "1", features = ["full"] }
url = "2"

[build-dependencies]
napi-build = "2"

[features]
default = ["headless", "lightpanda"]
headless = ["a3s-search/headless"]
lightpanda = ["a3s-search/lightpanda", "headless"]

[profile.release]
lto = true
strip = "symbols"
