<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="430" viewBox="0 0 1200 430"
     role="img" aria-labelledby="title desc">
  <title id="title">A3S Search — embeddable metasearch for Rust</title>
  <desc id="desc">A host application composes browser, HTTP and RSS, and native API sources behind one typed Rust search boundary, then receives ranked results with provenance and partial failures.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/>
      <stop offset="0.68" stop-color="#111923"/>
      <stop offset="1" stop-color="#15152a"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6ca3ff"/>
      <stop offset="1" stop-color="#8c83ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#6ca3ff"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="428" rx="24"
        fill="url(#background)" stroke="#263445" stroke-width="2"/>
  <path d="M570 42V388" stroke="#263445" stroke-width="2"/>

  <g id="identity" transform="translate(58 48)">
    <g id="route-mark" transform="translate(0 0)" fill="none" stroke-linecap="round">
      <circle cx="24" cy="24" r="20" stroke="#6ca3ff" stroke-width="5"/>
      <path d="M39 39L56 56" stroke="#8c83ff" stroke-width="6"/>
      <path d="M5 17H22M7 29H27M23 5V18" stroke="#3ccf91" stroke-width="3"/>
    </g>
    <text x="78" y="31" fill="#6ca3ff"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" font-weight="700" letter-spacing="2">A3S / EMBEDDABLE METASEARCH</text>

    <text y="132" fill="#eef4fb"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="70" font-weight="760" letter-spacing="-2.8">A3S Search</text>
    <text y="184" fill="#eef4fb"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="25" font-weight="650">Compose many search sources.</text>
    <text y="219" fill="#b8c4d3"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="25" font-weight="560">Keep one typed Rust boundary.</text>

    <g transform="translate(0 258)">
      <rect width="454" height="72" rx="8" fill="#111923" stroke="#31445b" stroke-width="2"/>
      <text x="20" y="29" fill="#eef4fb"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="17" font-weight="700">search.add_engine(engine);</text>
      <text x="20" y="55" fill="#8996a8"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="17">let results = search.search(query).await?;</text>
    </g>

    <g transform="translate(0 350)"
       font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
       font-size="17" font-weight="700">
      <circle cx="7" cy="7" r="7" fill="#6ca3ff"/>
      <text x="24" y="14" fill="#b8c4d3">RUST LIBRARY</text>
      <circle cx="164" cy="7" r="7" fill="#3ccf91"/>
      <text x="181" y="14" fill="#b8c4d3">CLI</text>
      <circle cx="245" cy="7" r="7" fill="#f0b44d"/>
      <text x="262" y="14" fill="#b8c4d3">MIT</text>
    </g>
  </g>

  <g id="embedded-kernel" transform="translate(610 36)">
    <rect width="532" height="358" rx="14" fill="#0f151e" stroke="#31445b" stroke-width="2"/>

    <g transform="translate(24 23)">
      <circle cx="8" cy="8" r="8" fill="#3ccf91"/>
      <text x="28" y="15" fill="#eef4fb"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="20" font-weight="700">embed://your-application</text>
      <text x="484" y="15" fill="#8996a8" text-anchor="end"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="16">RUST API</text>
    </g>
    <path d="M24 58H508" stroke="#263445" stroke-width="2"/>

    <g id="engine-source" transform="translate(24 82)">
      <rect width="148" height="66" rx="8" fill="#152235" stroke="#446da7"/>
      <text x="16" y="27" fill="#6ca3ff"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="20" font-weight="700">Engine</text>
      <text x="16" y="50" fill="#b8c4d3"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="16" font-weight="600">browser + web</text>
    </g>

    <g id="provider-source" transform="translate(24 174)">
      <rect width="148" height="66" rx="8" fill="#17182a" stroke="#4c4384"/>
      <text x="12" y="27" fill="#8c83ff"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="16" font-weight="700">SearchProvider</text>
      <text x="12" y="50" fill="#b8c4d3"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="16" font-weight="600">native search APIs</text>
    </g>

    <path d="M172 115H202" stroke="#6ca3ff" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M172 207H202" stroke="#8c83ff" stroke-width="2" marker-end="url(#arrow)"/>

    <g id="search-kernel" transform="translate(208 94)">
      <rect width="142" height="132" rx="10" fill="#131c26" stroke="#3d536d" stroke-width="2"/>
      <text x="71" y="35" fill="#eef4fb" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="24" font-weight="760">Search</text>
      <path d="M18 51H124" stroke="#31445b"/>
      <text x="71" y="76" fill="#b8c4d3" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="18" font-weight="650">async fan-out</text>
      <text x="71" y="101" fill="#b8c4d3" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="18" font-weight="650">timeouts + controls</text>
      <text x="71" y="123" fill="#3ccf91" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="16" font-weight="700">dedupe · rank</text>
    </g>

    <path d="M350 160H366" stroke="url(#route)" stroke-width="3" marker-end="url(#arrow)"/>

    <g id="typed-output" transform="translate(372 84)">
      <rect width="136" height="156" rx="10" fill="#10271f" stroke="#3ccf91" stroke-width="2"/>
      <text x="68" y="31" fill="#baf5dc" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="17" font-weight="700">SearchResults</text>
      <path d="M14 46H122" stroke="#28624e"/>
      <text x="18" y="73" fill="#79c9a8"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="16">results</text>
      <text x="18" y="96" fill="#79c9a8"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="16">provenance</text>
      <text x="18" y="119" fill="#79c9a8"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="16">failures</text>
      <text x="18" y="142" fill="#79c9a8"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="16">reports</text>
    </g>

    <g id="caller-policy" transform="translate(24 274)">
      <rect width="484" height="60" rx="8" fill="#111923" stroke="#31445b" stroke-width="2"/>
      <text x="18" y="25" fill="#eef4fb"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" font-weight="700">caller-owned policy</text>
      <text x="18" y="47" fill="#8996a8"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="17" font-weight="600">optional cascade · quality floor · verifiable receipt</text>
    </g>
  </g>
</svg>
