<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="title desc">
  <title id="title">A3S Search — one typed metasearch boundary</title>
  <desc id="desc">Browser, HTTP and RSS, and native API source lanes converge through the A3S Search Rust kernel into ranked results with provenance and typed failures. Semantic policy remains with the caller.</desc>

  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#5ea1ff"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#4ed6a0"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="438" rx="22"
        fill="#0b0f14" stroke="#273240" stroke-width="2"/>
  <path d="M566 36V404" stroke="#273240" stroke-width="2"/>

  <g id="identity" transform="translate(56 42)">
    <g id="convergence-mark" transform="translate(0 2)" fill="none" stroke-linecap="round">
      <circle cx="8" cy="7" r="6" fill="#5ea1ff" stroke="none"/>
      <circle cx="8" cy="25" r="6" fill="#4ed6a0" stroke="none"/>
      <circle cx="8" cy="43" r="6" fill="#f1b84b" stroke="none"/>
      <path d="M18 7H34L52 25M18 25H52M18 43H34L52 25" stroke="#9ba9b8" stroke-width="3"/>
      <circle cx="58" cy="25" r="8" stroke="#eef3f8" stroke-width="3"/>
    </g>
    <text x="82" y="31" fill="#7fb6ff"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" font-weight="700" letter-spacing="2">RUST / EMBEDDABLE METASEARCH</text>

    <text y="132" fill="#f3f6f9"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="72" font-weight="760" letter-spacing="-3">A3S Search</text>
    <text y="186" fill="#f3f6f9"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="28" font-weight="680">Many sources in.</text>
    <text y="224" fill="#aab6c3"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="28" font-weight="620">One typed result boundary out.</text>

    <g transform="translate(0 264)">
      <rect width="458" height="76" rx="10" fill="#111821" stroke="#334255" stroke-width="2"/>
      <text x="20" y="31" fill="#f3f6f9"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="19" font-weight="700">search.add_engine(source);</text>
      <text x="20" y="57" fill="#93a1b0"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18">search.search(query).await?</text>
    </g>

    <g transform="translate(0 374)"
       font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
       font-size="18" font-weight="700">
      <circle cx="7" cy="7" r="7" fill="#5ea1ff"/>
      <text x="24" y="14" fill="#aab6c3">LIBRARY</text>
      <circle cx="132" cy="7" r="7" fill="#4ed6a0"/>
      <text x="149" y="14" fill="#aab6c3">CLI</text>
      <circle cx="224" cy="7" r="7" fill="#f1b84b"/>
      <text x="241" y="14" fill="#aab6c3">CALLER-OWNED POLICY</text>
    </g>
  </g>

  <g id="retrieval-kernel" transform="translate(598 34)">
    <rect width="544" height="372" rx="14" fill="#0f151d" stroke="#334255" stroke-width="2"/>

    <text x="24" y="31" fill="#93a1b0"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" font-weight="700">ONE EXACT SearchQuery</text>
    <text x="520" y="31" text-anchor="end" fill="#4ed6a0"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" font-weight="700">NO HIDDEN REWRITE</text>
    <path d="M24 48H520" stroke="#273240" stroke-width="2"/>

    <g id="source-lanes" transform="translate(22 69)">
      <g>
        <rect width="158" height="64" rx="9" fill="#122238" stroke="#4678b8" stroke-width="2"/>
        <circle cx="18" cy="20" r="6" fill="#5ea1ff"/>
        <text x="34" y="27" fill="#dce9f9"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="21" font-weight="700">Browser</text>
        <text x="18" y="51" fill="#8da5c2"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="18">rendered</text>
      </g>

      <g transform="translate(0 82)">
        <rect width="158" height="64" rx="9" fill="#10251e" stroke="#388d6a" stroke-width="2"/>
        <circle cx="18" cy="20" r="6" fill="#4ed6a0"/>
        <text x="34" y="27" fill="#dff8ed"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="21" font-weight="700">HTTP / RSS</text>
        <text x="18" y="51" fill="#83b49f"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="18">conventional</text>
      </g>

      <g transform="translate(0 164)">
        <rect width="158" height="64" rx="9" fill="#2a2112" stroke="#9e7938" stroke-width="2"/>
        <circle cx="18" cy="20" r="6" fill="#f1b84b"/>
        <text x="34" y="27" fill="#faedcf"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="21" font-weight="700">Native API</text>
        <text x="18" y="51" fill="#c7aa74"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="18">providers</text>
      </g>
    </g>

    <path d="M180 101H204L224 183" fill="none" stroke="#5ea1ff" stroke-width="3"/>
    <path d="M180 183H224" fill="none" stroke="#4ed6a0" stroke-width="3"/>
    <path d="M180 265H204L224 183" fill="none" stroke="#f1b84b" stroke-width="3"/>
    <path d="M224 183H240" stroke="#5ea1ff" stroke-width="3" marker-end="url(#arrow-blue)"/>

    <g id="search" transform="translate(246 112)">
      <rect width="116" height="142" rx="11" fill="#151d27" stroke="#5a6b7e" stroke-width="2"/>
      <text x="58" y="37" text-anchor="middle" fill="#f3f6f9"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="24" font-weight="760">Search</text>
      <path d="M16 52H100" stroke="#334255" stroke-width="2"/>
      <text x="58" y="79" text-anchor="middle" fill="#aab6c3"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="18" font-weight="650">fan out</text>
      <text x="58" y="103" text-anchor="middle" fill="#aab6c3"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="18" font-weight="650">normalize</text>
      <text x="58" y="127" text-anchor="middle" fill="#7fb6ff"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" font-weight="700">fuse</text>
    </g>

    <path d="M362 183H382" stroke="#4ed6a0" stroke-width="3" marker-end="url(#arrow-green)"/>

    <g id="results" transform="translate(388 94)">
      <rect width="132" height="178" rx="11" fill="#10241d" stroke="#4ed6a0" stroke-width="2"/>
      <text x="66" y="32" text-anchor="middle" fill="#dff8ed"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" font-weight="760">SearchResults</text>
      <path d="M14 47H118" stroke="#2d6e55" stroke-width="2"/>
      <text x="18" y="76" fill="#8dd9b7"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">ranked URLs</text>
      <text x="18" y="103" fill="#8dd9b7"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">provenance</text>
      <text x="18" y="130" fill="#8dd9b7"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">failures</text>
      <text x="18" y="157" fill="#8dd9b7"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">outcomes</text>
    </g>

    <g id="boundary" transform="translate(22 315)">
      <rect width="498" height="38" rx="8" fill="#111821" stroke="#334255" stroke-width="2"/>
      <text x="16" y="25" fill="#7fb6ff"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" font-weight="700">SEARCH: RETRIEVAL</text>
      <text x="482" y="25" text-anchor="end" fill="#aab6c3"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" font-weight="700">CALLER: MEANING</text>
    </g>
  </g>
</svg>
