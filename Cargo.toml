[workspace]
members = []

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["A3S Lab Team"]

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
async-trait = "0.1"
futures = "0.3"
tokio-test = "0.4"

[package]
name = "a3s-search"
version = "1.4.1"
edition.workspace = true
license.workspace = true
repository = "https://github.com/A3S-Lab/Search"
authors.workspace = true
description = "Embeddable meta search engine library with CLI and proxy pool support"

[[bin]]
name = "a3s-search"
path = "src/main.rs"

[features]
default = []
headless = ["dep:chromiumoxide", "dep:which", "dep:zip"]
# Lightpanda headless backend (Linux/macOS only; Windows unsupported by Lightpanda).
# Depends on `headless` because it reuses chromiumoxide as the CDP client.
lightpanda = ["headless"]

[dependencies]
# Async runtime
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true

# Async utilities
async-trait.workspace = true
futures.workspace = true

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "socks"] }

# HTML parsing
scraper = "0.22"

# Main article content extraction (Readability.js port, pure Rust)
dom_smoothie = "0.18"

# URL handling
url = "2"
urlencoding = "2"

# Configuration file parsing
a3s-acl = "0.2"

# Headless browser (optional, for JS-rendered engines)
chromiumoxide = { version = "0.7", features = ["tokio-runtime"], optional = true }

# Browser detection and auto-install (optional, for headless feature)
which = { version = "7", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

# Self-update
a3s-updater = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging for CLI
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-test.workspace = true

# =============================================================================
# Release Profile — optimized for binary size
# =============================================================================
# a3s-search is a CLI/library with optional headless browser (chromiumoxide).
# I/O-bound workload — optimize for size over speed.
#
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
